    <script>
      // Gracefully silence Vite HMR WebSocket connection in Cloud Run iframe
      (function() {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isHmr = false;
            if (typeof protocols === 'string' && protocols === 'vite-hmr') isHmr = true;
            if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isHmr = true;
            if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1)) isHmr = true;

            if (isHmr) {
              var listeners = {};
              var mock = {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // WebSocket.OPEN so Vite skips await Promise rejection
                url: url,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                addEventListener: function(event, handler) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(handler);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { handler({ type: 'open', target: mock }); } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, handler) {
                  if (!listeners[event]) return;
                  listeners[event] = listeners[event].filter(function(h) { return h !== handler; });
                },
                send: function() {},
                close: function() {
                  mock.readyState = 3;
                },
                dispatchEvent: function() { return true; }
              };
              return mock;
            }

            try {
              return new OriginalWebSocket(url, protocols);
            } catch (e) {
              return new OriginalWebSocket(url);
            }
          };

          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var isWsError = function(err) {
          if (!err) return false;
          var msg = String(err.message || err.reason || err || '');
          return msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1 || msg.indexOf('closed without opened') !== -1;
        };

        window.addEventListener('error', function(e) {
          if (isWsError(e.error) || isWsError(e.message)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isWsError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          if (args.some(function(arg) { return isWsError(arg); })) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
